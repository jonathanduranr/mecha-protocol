<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#13041a" stroke="#c084fc" stroke-width="2.5"/>
  <!-- Anillo orbital -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 4" opacity="0.5"/>
  <!-- Núcleo magnético central -->
  <circle cx="32" cy="32" r="7" fill="#7e22ce" stroke="#ffffff" stroke-width="2"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  <!-- 4 Sierras de metralla orbital -->
  <!-- Sierra Superior -->
  <g transform="translate(32, 11)">
    <polygon points="0,-6 4,-2 6,0 2,4 0,6 -2,4 -6,0 -4,-2" fill="#e9d5ff" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
  <!-- Sierra Inferior -->
  <g transform="translate(32, 53)">
    <polygon points="0,-6 4,-2 6,0 2,4 0,6 -2,4 -6,0 -4,-2" fill="#e9d5ff" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
  <!-- Sierra Izquierda -->
  <g transform="translate(11, 32)">
    <polygon points="0,-6 4,-2 6,0 2,4 0,6 -2,4 -6,0 -4,-2" fill="#e9d5ff" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
  <!-- Sierra Derecha -->
  <g transform="translate(53, 32)">
    <polygon points="0,-6 4,-2 6,0 2,4 0,6 -2,4 -6,0 -4,-2" fill="#e9d5ff" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
  <!-- Líneas de rotación cinética -->
  <path d="M 38 13 A 21 21 0 0 1 51 26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 26 51 A 21 21 0 0 1 13 38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
